{% extends "base.html" %}
{% block title %}Продажа билета{% endblock %}
{% block page_title %}Новый билет{% endblock %}
{% block content %}
<div class="form-card">
    <form method="post">
        <div class="form-grid">
            <div class="form-group full">
                <label>ФИО посетителя</label>
                <input type="text" name="visitor_name" required placeholder="Иванов Иван Иванович">
            </div>
            <div class="form-group">
                <label>Аттракцион</label>
                <select name="attraction_id" required id="attr_sel" onchange="updatePrice()">
                    <option value="">— Выберите —</option>
                    {% for a in attractions %}
                    <option value="{{ a.id }}" data-price="{{ a.price }}">{{ a.name }} — {{ "%.0f"|format(a.price) }} ₽</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Кассир</label>
                <select name="employee_id" required>
                    {% for e in employees %}
                    <option value="{{ e.id }}">{{ e.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Дата посещения</label>
                <input type="date" name="visit_date" required value="{{ today }}">
            </div>
            <div class="form-group">
                <label>Количество билетов</label>
                <input type="number" name="quantity" min="1" max="20" value="1" required onchange="updatePrice()">
            </div>
            <div class="form-group">
                <label>Способ оплаты</label>
                <select name="payment_method">
                    <option value="cash">💵 Наличные</option>
                    <option value="card">💳 Банковская карта</option>
                </select>
            </div>
            <div class="form-group full">
                <div style="background:var(--surface2);border-radius:8px;padding:14px;font-size:1.1rem">
                    Итого к оплате: <strong id="total_display" style="color:#10b981;font-size:1.3rem">0 ₽</strong>
                </div>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">🎫 Продать</button>
            <a href="/tickets" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
<script>
function updatePrice() {
    const sel = document.getElementById('attr_sel');
    const qty = document.querySelector('[name=quantity]').value;
    const price = sel.options[sel.selectedIndex]?.dataset.price || 0;
    document.getElementById('total_display').textContent = (price * qty).toFixed(0) + ' ₽';
}
</script>
{% endblock %}
