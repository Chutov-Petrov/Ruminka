{% extends "base.html" %}
{% block title %}Новый инцидент{% endblock %}
{% block page_title %}Зарегистрировать инцидент{% endblock %}
{% block content %}
<div class="form-card">
    <form method="post">
        <div class="form-grid">
            <div class="form-group">
                <label>Аттракцион</label>
                <select name="attraction_id" required>
                    {% for a in attractions %}
                    <option value="{{ a.id }}">{{ a.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Степень серьёзности</label>
                <select name="severity">
                    <option>Низкая</option>
                    <option>Средняя</option>
                    <option>Высокая</option>
                </select>
            </div>
            <div class="form-group full">
                <label>Описание инцидента</label>
                <textarea name="description" required placeholder="Подробно опишите произошедшее..."></textarea>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">⚠️ Зарегистрировать</button>
            <a href="/incidents" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
